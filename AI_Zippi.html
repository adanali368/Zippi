<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Zippi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --px:'Press Start 2P','Courier New',monospace;
  --vt:'VT323','Courier New',monospace;
  --fs:22px;
  --bg:#14122b;--p1:#1d1a3c;--p2:#272250;--p3:#342d66;
  --ac:#5ad1ff;--ac2:#ff6fae;--tx:#efe8ff;--mu:#9a92c9;--ink:#090717;--onac:#090717;
  --ok:#6bdc8b;--warn:#ffd23f;--bad:#ff5f5f;
  --nt:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  --bevel:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.13);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body.big{--fs:26px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.1 var(--vt);-webkit-font-smoothing:none;image-rendering:pixelated;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;text-align:left}
:focus-visible{outline:4px dashed var(--ac2);outline-offset:2px}
svg.ic{display:block;flex:none}
svg.av{display:block;flex:none;image-rendering:pixelated}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--p3);box-shadow:inset 0 0 0 3px var(--ink)}
::-webkit-scrollbar-track{background:var(--bg)}
*{scrollbar-color:var(--p3) var(--bg)}

#app{height:100%;display:flex;position:relative;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s steps(4);z-index:25}
.scrim.on{opacity:1;pointer-events:auto}

/* ===== sol gezinti ===== */
.nav{display:flex;flex:none;height:100%;z-index:30}
.rail{width:72px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;overflow-y:auto;scrollbar-width:none;border-right:4px solid var(--ink)}
.rail::-webkit-scrollbar{display:none}
.srv{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--c);color:#090717;font:11px var(--px);box-shadow:var(--nt),var(--bevel);transition:transform .15s steps(2)}
.srv:hover{transform:translateY(-4px)}
.srv:active{transform:translateY(2px)}
.srv::before{content:'';position:absolute;left:-14px;top:50%;width:6px;height:0;margin-top:0;background:var(--tx);transition:height .2s steps(3),margin .2s steps(3)}
.srv.un::before{height:10px;margin-top:-5px}
.srv.act::before{height:30px;margin-top:-15px}
.srv.add{background:var(--p3);color:var(--ok)}
.sep{width:32px;height:4px;background:var(--p3);flex:none}

.side{width:244px;background:var(--p1);display:flex;flex-direction:column;min-width:0;border-right:4px solid var(--ink)}
.shead{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:4px solid var(--ink);font:11px var(--px);width:100%}
.shead:hover{background-color:var(--p2)}
.shead #sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chv{display:grid;transition:transform .2s steps(3)}
.shead[aria-expanded=true] .chv{transform:rotate(180deg)}
.chlist{flex:1;overflow-y:auto;padding:8px 8px 16px}
.cat{margin-top:8px}
.cathd{display:flex;align-items:center;justify-content:space-between;height:32px}
.cbtn{display:flex;align-items:center;gap:6px;color:var(--mu);height:32px;flex:1;min-width:0;font-size:20px}
.cbtn:hover{color:var(--tx)}
.cbtn .ic{transition:transform .2s steps(3)}
.cat.col .cbtn .ic{transform:rotate(-90deg)}
.catbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s steps(5)}
.cat.col .catbody{grid-template-rows:0fr}
.catin{overflow:hidden;min-height:0}
.ch{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 8px;color:var(--mu);position:relative}
.ch:hover{background:var(--p2);color:var(--tx)}
.ch.act{background:var(--p3);color:var(--tx);box-shadow:inset 4px 0 0 var(--ac)}
.ch.un{color:var(--tx)}
.ch .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{background:var(--ac2);color:var(--onac);font:9px var(--px);padding:4px 5px;box-shadow:0 0 0 2px var(--ink);animation:bump .4s steps(2)}
.vusers{padding:0 0 4px 30px}
.vu{display:flex;align-items:center;gap:8px;height:30px;color:var(--mu);font-size:20px}
.vu span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vu.sp{color:var(--tx)}
.sp svg.av{animation:talk .5s steps(1) infinite}
.vbar{margin:8px;padding:8px 10px;background:var(--p2);box-shadow:var(--nt);display:flex;align-items:center;gap:8px;animation:popIn .25s steps(4) both;transform-origin:bottom left}
.vbar .vt{flex:1;min-width:0;line-height:1}
.vbar .vt b{display:block;color:var(--ok);font:9px var(--px);margin-bottom:6px}
.vbar .vt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu);font-size:19px}
.ubar{flex:none;height:64px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;background:var(--bg);border-top:4px solid var(--ink)}
.me-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:48px;padding:0 6px}
.me-btn:hover{background:var(--p1)}
.me-btn .who{min-width:0;line-height:1}
.me-btn .who b{display:block;font:10px var(--px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.me-btn .who span{color:var(--mu);font-size:19px}
.stw{position:relative;flex:none;--ring:var(--p1)}
.ubar .stw{--ring:var(--bg)}
.sd{position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;box-shadow:0 0 0 3px var(--ring)}
.st-on{background:var(--ok)}.st-idle{background:var(--warn)}.st-dnd{background:var(--bad)}.st-off{background:#8a84a8}
.dot{display:inline-block;width:14px;height:14px;flex:none}

.ibtn{width:40px;height:40px;display:grid;place-items:center;color:var(--mu);flex:none}
.ibtn:hover{color:var(--tx);background:var(--p3)}
.ibtn.sm{width:28px;height:28px}
.ibtn.on{color:var(--tx);background:var(--p3)}

/* ===== ana alan ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--p2)}
.top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:4px solid var(--ink);background:var(--p2)}
.only-m{display:none}
.ttl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ttl b{font:12px var(--px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .topic{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:12px;border-left:4px solid var(--p3)}
.live{font:9px var(--px);color:var(--ok);padding:6px 8px;background:var(--bg);box-shadow:0 0 0 3px var(--ink);white-space:nowrap}
.live i{display:inline-block;width:8px;height:8px;background:var(--ok);margin-right:6px;animation:blink 1s steps(1) infinite}
.body{flex:1;min-height:0;display:flex}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:8px 0 12px;overscroll-behavior:contain}
.intro{padding:24px 16px 16px;border-bottom:4px solid var(--p3);margin:0 16px 12px}
.intro h2{font:14px var(--px);margin:14px 0 12px;line-height:1.4}
.intro p{color:var(--mu)}
.msg{position:relative;display:flex;gap:12px;padding:5px 16px}
.msg:hover{background:rgba(255,255,255,.04)}
.msg.new{animation:msgIn .28s steps(4) both}
.gut{width:44px;flex:none;text-align:center}
.gut .t2{opacity:0;color:var(--mu);font-size:17px;line-height:22px}
.msg:hover .gut .t2{opacity:1}
.mb{min-width:0;flex:1}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.name{font:10px var(--px)}
.time{color:var(--mu);font-size:18px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs);line-height:1.15}
.txt code{background:var(--bg);padding:0 6px;box-shadow:0 0 0 2px var(--ink);color:var(--ok)}
.txt b{color:#fff}
.mention{background:rgba(90,209,255,.2);color:var(--ac);padding:0 3px}
.mention.me{background:var(--ac2);color:var(--onac)}
.rq{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:19px;margin-bottom:4px;min-width:0}
.rq b{color:var(--tx);font-weight:400}
.rq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rxs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rx{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--p3);box-shadow:0 0 0 3px var(--ink);font-size:18px;transition:transform .12s steps(2)}
.rx b{font-weight:400;color:var(--mu)}
.rx:hover{transform:translateY(-2px)}
.rx.mine{background:rgba(90,209,255,.22);box-shadow:0 0 0 3px var(--ac)}
.rx.mine b{color:var(--ac)}
.tools{display:none;position:absolute;right:16px;top:-16px;background:var(--p1);box-shadow:var(--nt);z-index:2}
.tools .ibtn{width:34px;height:32px}
@media (hover:hover){.msg:hover .tools{display:flex}}
.msg.sel .tools{display:flex}
.msg.sel{background:rgba(255,255,255,.05)}

.typing{height:26px;flex:none;padding:0 20px;color:var(--mu);font-size:19px;display:flex;align-items:center;gap:6px}
.typing .dots i{display:inline-block;width:6px;height:6px;background:var(--ac);margin-right:3px;animation:blink 1s steps(1) infinite}
.typing .dots i:nth-child(2){animation-delay:.2s}.typing .dots i:nth-child(3){animation-delay:.4s}
.rbar{margin:0 20px;padding:6px 12px;background:var(--p1);display:flex;align-items:center;gap:8px;font-size:19px;color:var(--mu);box-shadow:0 0 0 0 var(--ink);animation:popIn .2s steps(3) both;transform-origin:bottom left}
.rbar b{color:var(--tx);font-weight:400}
.rbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{padding:6px 20px 18px;flex:none}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--p3);padding:4px 6px;box-shadow:var(--nt),inset 4px 4px 0 rgba(0,0,0,.25);margin:4px}
.cbox textarea{flex:1;min-width:0;resize:none;outline:none;max-height:140px;padding:10px 6px;line-height:1.1;font-size:var(--fs);height:44px}
.cbox textarea::placeholder{color:var(--mu)}
.cbox .ibtn{height:44px;width:44px}
.cbox .send{color:var(--ac)}
.cbox .send:hover{background:var(--ac);color:var(--onac)}

.members{width:236px;flex:none;background:var(--p1);border-left:4px solid var(--ink);overflow:hidden;transition:width .26s steps(5),border-left-width .26s steps(5)}
.members.closed{width:0;border-left-width:0}
.min{width:236px;height:100%;overflow-y:auto;padding:8px 10px 24px}
.mgrp{color:var(--mu);font-size:19px;margin:14px 6px 6px}
.mem{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 6px;animation:miIn .22s steps(3) both;animation-delay:calc(var(--i,0)*35ms)}
.mem:hover{background:var(--p3)}
.mem .mi2{min-width:0;line-height:1}
.mem .mi2 b{display:block;font:9px var(--px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.mem .mi2 span{display:block;color:var(--mu);font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== ses sahnesi ===== */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px;gap:20px;overflow-y:auto}
.stagehd{display:flex;align-items:center;gap:10px;font:12px var(--px)}
.tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;align-content:center;justify-items:center}
.tile{width:100%;max-width:190px;aspect-ratio:1/1.08;background:var(--p1);box-shadow:var(--nt),var(--bevel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;margin:4px;animation:popIn .3s steps(4) both}
.tile span{font:9px var(--px);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mm{position:absolute;right:8px;top:8px;color:var(--bad)}
.tile.sp{animation:hop .5s steps(2) infinite;box-shadow:0 -4px 0 0 var(--ac),0 4px 0 0 var(--ac),-4px 0 0 0 var(--ac),4px 0 0 0 var(--ac),var(--bevel)}
.empty{color:var(--mu);grid-column:1/-1;text-align:center}
.ctrls{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

/* ===== düğme, girdi ===== */
.btn{display:inline-flex;align-items:center;gap:10px;font:10px var(--px);color:var(--tx);background:var(--p3);padding:13px 16px;margin:4px;box-shadow:var(--nt),var(--bevel);transition:transform .08s steps(1)}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(4px);box-shadow:var(--nt),inset 4px 4px 0 rgba(0,0,0,.3)}
.btn.pri{background:var(--ac);color:var(--onac)}
.btn.dng{background:var(--bad);color:#2a0707}
.in{display:block;width:calc(100% - 8px);margin:4px;background:var(--bg);padding:10px 12px;font-size:var(--fs);box-shadow:var(--nt),inset 4px 4px 0 rgba(0,0,0,.4);outline:none}
.in:focus{box-shadow:0 -4px 0 0 var(--ac),0 4px 0 0 var(--ac),-4px 0 0 0 var(--ac),4px 0 0 0 var(--ac),inset 4px 4px 0 rgba(0,0,0,.4)}
.lbl{display:block;font:9px var(--px);color:var(--mu);margin:20px 0 10px;line-height:1.5}
.sw{display:flex;flex-wrap:wrap;gap:14px;padding:4px}
.sw button{width:36px;height:36px;background:var(--c);box-shadow:var(--nt),var(--bevel)}
.sw button[aria-pressed=true]{box-shadow:0 -4px 0 0 var(--tx),0 4px 0 0 var(--tx),-4px 0 0 0 var(--tx),4px 0 0 0 var(--tx),var(--bevel);transform:translateY(-4px)}
.tog{position:relative;flex:none;width:60px;height:28px;margin:4px;background:var(--bg);box-shadow:var(--nt)}
.tog::after{content:'';position:absolute;left:4px;top:4px;width:20px;height:20px;background:var(--mu);transition:left .16s steps(3)}
.tog[aria-checked=true]{background:var(--ac)}
.tog[aria-checked=true]::after{left:36px;background:var(--onac)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
.row small{display:block;color:var(--mu);font-size:19px;margin-top:4px}

/* ===== açılır menüler ===== */
#layer{position:relative;z-index:90}
.pw{position:fixed;inset:0;z-index:80}
.pb{position:absolute;inset:0}
.pop{position:fixed;background:var(--p1);box-shadow:var(--nt),var(--bevel);margin:4px;animation:popIn .24s steps(5) both;max-width:calc(100vw - 24px)}
.pw.out .pop{animation:popOut .14s steps(3) both}
.pw.out .pb{pointer-events:none}
.menu{min-width:230px;padding:6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;animation:miIn .2s steps(3) both;animation-delay:calc(var(--i,0)*30ms)}
.mi:hover,.mi:focus-visible{background:var(--ac);color:var(--onac)}
.mi.dng{color:var(--bad)}
.mi.dng:hover{background:var(--bad);color:#2a0707}
.mi span{flex:1}
.mi .gap{width:16px}
.msep{height:4px;background:var(--p3);margin:6px 0}
.picker{padding:10px;width:340px}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emg button{height:38px;display:grid;place-items:center;font-size:22px;font-family:system-ui,'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;animation:miIn .2s steps(3) both;animation-delay:calc(var(--i,0)*8ms)}
.emg button:hover{background:var(--p3);transform:scale(1.25)}
.card{width:270px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.card b{font:12px var(--px)}
.card span{color:var(--mu)}
.pw.sheet .pop{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;margin:0;max-height:75%;overflow:auto;animation:sheetIn .28s steps(6) both;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 0 0 var(--ink),var(--bevel)}
.pw.sheet.out .pop{animation:sheetOut .16s steps(3) both}
.pw.sheet .pb{background:rgba(0,0,0,.55)}
.pw.sheet .picker,.pw.sheet .card{width:auto}
.pw.sheet .mi{height:48px}

/* ===== modal ===== */
.mback{position:fixed;inset:0;background:rgba(5,3,15,.72);display:grid;place-items:center;z-index:100;animation:fade .2s steps(3) both;padding:16px}
.mback.out{animation:fadeOut .16s steps(3) both}
.modal{background:var(--p1);width:min(700px,100%);height:min(540px,100%);display:flex;flex-direction:column;box-shadow:var(--nt),var(--bevel);margin:4px;animation:modalIn .32s steps(6) both}
.mback.out .modal{animation:modalOut .16s steps(3) both}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;height:56px;flex:none;border-bottom:4px solid var(--ink);font:12px var(--px)}
.mbody{flex:1;min-height:0;display:flex}
.mtabs{width:180px;flex:none;border-right:4px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.mtabs button{height:40px;padding:0 12px;color:var(--mu)}
.mtabs button:hover{background:var(--p2);color:var(--tx)}
.mtabs button[aria-selected=true]{background:var(--p3);color:var(--tx);box-shadow:inset 4px 0 0 var(--ac)}
.pane{flex:1;min-width:0;overflow-y:auto;padding:6px 22px 22px;animation:tabIn .22s steps(4) both}
.pane.plain{padding:18px 22px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:4px solid var(--ink)}
.prof{display:flex;align-items:center;gap:18px;padding-top:18px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:4px}
.theme{padding:10px;background:var(--bg);box-shadow:var(--nt);display:flex;flex-direction:column;gap:10px;margin:4px}
.theme[aria-pressed=true]{box-shadow:0 -4px 0 0 var(--ac),0 4px 0 0 var(--ac),-4px 0 0 0 var(--ac),4px 0 0 0 var(--ac)}
.theme i{display:flex;height:22px}
.theme i u{flex:1}
.kinds{display:flex;gap:8px;flex-wrap:wrap}
.kinds button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
select.in{appearance:none}

#toasts{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--tx);color:var(--bg);padding:10px 14px;box-shadow:var(--nt);margin:4px;animation:toastIn .3s steps(5) both;font-size:21px}
.toast.out{animation:popOut .2s steps(3) both}

#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .4s steps(5)}
#boot.go{opacity:0;pointer-events:none}
.bootin{text-align:center}
.bootin h1{font:16px var(--px);line-height:1.6;margin-bottom:26px}
.bootin h1 span{color:var(--ac2)}
.bar{width:220px;height:20px;margin:4px auto;background:var(--p1);box-shadow:var(--nt);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);animation:load 1s steps(10) forwards}
.bootin p{margin-top:22px;color:var(--mu)}
body.crt::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}

@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{to{transform:scale(.7);opacity:0}}
@keyframes miIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes msgIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes modalIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}

function icon(n,s=20,col){
  const rects=(b,fill)=>{let r='';b.split('|').forEach((row,y)=>{let x=0;while(x<row.length){if(row[x]==='#'){let w=1;while(row[x+w]==='#')w++;r+=`<rect x="${x}" y="${y}" width="${w}" height="1"${fill?` fill="${fill}"`:''}/>`;x+=w}else x++}});return r};
  let body;
  if(n==='micoff') body=rects(BM.mic)+rects(BM.slash,'#ff5f5f'); else body=rects(BM[n]||BM.dots);
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 8 8" fill="${col||'currentColor'}" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;
}

/* ---------- piksel avatar ---------- */
const avCache={};
function okImg(v){return typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(v)}
function avatar(seed,color,size=40,photo){
  if(okImg(photo))return `<img class="av" src="${photo}" width="${size}" height="${size}" alt="">`;
  const key=seed+color;let inner=avCache[key];
  if(!inner){
    const r=rng(String(seed)),g=[];
    for(let y=0;y<7;y++){g[y]=[];for(let x=0;x<4;x++)g[y][x]=r()<.56}
    for(let x=0;x<4;x++){g[3][x]=true;g[2][x]=x>0||g[2][x];g[1][x]=g[1][x]&&x>1||x===3}
    g[4][3]=true;g[3][0]=true;
    let s='',e='';
    for(let y=0;y<7;y++)for(let x=0;x<7;x++){
      const mx=x<4?x:6-x;if(!g[y][mx])continue;
      if(y===2&&(x===1||x===5))e+=`<rect x="${x+1}" y="${y+1}" width="1" height="1"/>`;
      else s+=`<rect x="${x+1}" y="${y+1}" width="1" height="1"/>`;
    }
    inner=`<rect width="9" height="9" fill="#0a0818"/><rect width="9" height="9" fill="${color}" fill-opacity=".22"/><g fill="${color}">${s}</g><g fill="#0a0818">${e}</g>`;
    avCache[key]=inner;
  }
  return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">${inner}</svg>`;
}

const fmtTime=ts=>{const d=new Date(ts),t=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});return new Date().toDateString()===d.toDateString()?t:d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' '+t};

function author(m){
  if(m.uid==='me')return{name:S.user.name,color:S.user.color,seed:S.user.seed,photo:S.user.photo};
  if(BOTS[m.uid])return{name:BOTS[m.uid].name,color:BOTS[m.uid].color,seed:m.uid};
  if(String(m.uid).startsWith('cb:')){for(const sv of S.servers){const b=(sv.cbots||[]).find(x=>'cb:'+x.id===m.uid);if(b)return{name:b.name,color:b.color,seed:m.uid}}return{name:'Bot',color:'#9a92c9',seed:m.uid}}
  return m.au||{name:'Misafir',color:'#9a92c9',seed:'x'};
}
function who(uid){return author({uid})}
function fmt(t){
  let h=esc(t);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/@[\p{L}\p{N}_-]+/gu,m=>`<span class="mention${m.slice(1).toLowerCase()===S.user.name.toLowerCase()?' me':''}">${m}</span>`);
  return h;
}

/* ---------- ses efektleri ---------- */
let AC;
function beep(f=660,d=.07,type='square',v=.035){
  if(!S.settings.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={send:()=>{beep(520,.05);setTimeout(()=>beep(780,.07),60)},recv:()=>beep(440,.08,'triangle',.05),open:()=>beep(330,.04,'square',.02),join:()=>{beep(392,.06);setTimeout(()=>beep(587,.08),70)}};

/* ---------- popup / menü ---------- */
let popEl=null;
function closePop(){
  if(!popEl)return;const p=popEl;popEl=null;p.classList.add('out');
  $$('[aria-expanded=true]').forEach(e=>e.setAttribute('aria-expanded','false'));
  setTimeout(()=>p.remove(),150);
}
function openPop(anchor,build,o={}){
  closePop();
  const wrap=document.createElement('div');wrap.className='pw';
  const sheet=innerWidth<=640;if(sheet)wrap.classList.add('sheet');
  const back=document.createElement('div');back.className='pb';
  back.addEventListener('pointerdown',e=>{e.preventDefault();closePop()});
  const box=document.createElement('div');box.className='pop '+(o.cls||'');
  build(box);wrap.append(back,box);$('#layer').append(wrap);popEl=wrap;
  if(!sheet){
    const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,right:anchor.x,top:anchor.y,bottom:anchor.y};
    const bw=box.offsetWidth,bh=box.offsetHeight,W=innerWidth,H=innerHeight;
    let x,y,oy='top';
    if(o.side==='left'){x=r.left-bw-14;y=r.top-8}else{x=o.right?r.right-bw:r.left;y=r.bottom+8}
    if(y+bh>H-8){if(o.side==='left'){y=H-bh-12}else{y=r.top-bh-8;oy='bottom'}}
    if(y<8)y=8;
    x=Math.min(Math.max(8,x),W-bw-12);
    box.style.left=x+'px';box.style.top=y+'px';
    box.style.transformOrigin=(o.right||o.side==='left'?'right ':'left ')+oy;
  }
  return box;
}
function menu(anchor,items,o={}){
  sfx.open();
  return openPop(anchor,box=>{
    box.classList.add('menu');box.setAttribute('role','menu');
    items.forEach((it,i)=>{
      if(it.sep){box.insertAdjacentHTML('beforeend','<div class="msep"></div>');return}
      const b=document.createElement('button');b.className='mi'+(it.danger?' dng':'');b.setAttribute('role','menuitem');b.style.setProperty('--i',i);
      b.innerHTML=(it.icon?icon(it.icon,16):it.dot?`<i class="dot st-${it.dot}"></i>`:'<span class="gap"></span>')+`<span>${esc(it.label)}</span>`+(it.on?icon('check',14):'');
      b.onclick=()=>{closePop();it.fn&&it.fn()};box.append(b);
    });
  },o);
}
function picker(anchor,onPick,o={}){
  sfx.open();
  openPop(anchor,box=>{
    box.classList.add('picker');
    box.innerHTML='<div class="emg">'+EMO.map((e,i)=>`<button style="--i:${i}" data-e="${e}" aria-label="${e}">${e}</button>`).join('')+'</div>';
    box.addEventListener('click',ev=>{const b=ev.target.closest('[data-e]');if(b){closePop();onPick(b.dataset.e)}});
  },o);
}

let modalEl=null;
function closeModal(){
  if(!modalEl){$$('.mback').forEach(x=>x.remove());return}const m=modalEl;modalEl=null;m.classList.add('out');setTimeout(()=>m.remove(),170);
}
function openModal(title,inner,o={}){
  closePop();closeModal();sfx.open();
  const el=document.createElement('div');el.className='mback';
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${o.style?`style="${o.style}"`:''}><div class="mhd"><span>${esc(title)}</span><button class="ibtn" data-close aria-label="Kapat">${icon('close',18)}</button></div>${inner}</div>`;
  el.querySelector('[data-close]').addEventListener('click',e=>{e.stopPropagation();closeModal()});
  el.addEventListener('pointerdown',e=>{if(e.target===el)closeModal()});
  el.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});
  $('#layer').append(el);modalEl=el;
  const f=$('input,textarea',el);if(f&&!matchMedia('(pointer:coarse)').matches)f.focus();
  return el;
}

function toast(t){
  const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);
  setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),220)},2300);
  while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
}
function copy(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Kopyalandı')}catch(e){toast('Kopyalanamadı')}ta.remove()};
  try{navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı')).catch(fb)}catch(e){fb()}
}

function ensureMsgs(cid){
  if(S.msgs[cid])return;
  const f=findChan(cid);if(!f||f.c.type!=='text'){S.msgs[cid]=[];return}
  const r=rng(cid),pool=(POOL[f.c.pool||'genel']).slice(),list=[];
  const n=Math.min(5,pool.length);let t=NOW()-(n+1)*8*60000;
  for(let i=0;i<n;i++){
    const text=pool.splice(Math.floor(r()*pool.length),1)[0];
    t+=(3+r()*9)*60000;
    list.push({id:rid(),uid:f.s.bots[Math.floor(r()*f.s.bots.length)],text,ts:Math.min(t,NOW()-60000),rx:{}});
  }
  S.msgs[cid]=list;
}

function setActive(sid,cid){
  const s=S.servers.find(x=>x.id===sid);if(!s)return;
  const c=s.chans.find(x=>x.id===cid)||s.chans.find(x=>x.id===S.last[sid])||s.chans.find(x=>x.type==='text')||s.chans[0];

  closeDrawers();renderAll();save();

let mic={stream:null,ctx:null,an:null,buf:null,t:null};
async function startMic(){
  if(mic.stream)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'NoApi'};
    mic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    mic.stream.getAudioTracks().forEach(t=>t.enabled=!voice.muted);
    mic.ctx=new(window.AudioContext||window.webkitAudioContext)();mic.an=mic.ctx.createAnalyser();mic.an.fftSize=512;
    mic.ctx.createMediaStreamSource(mic.stream).connect(mic.an);mic.buf=new Uint8Array(mic.an.fftSize);
    mic.t=setInterval(()=>{
      mic.an.getByteTimeDomainData(mic.buf);let m=0;for(const v of mic.buf)m=Math.max(m,Math.abs(v-128));
      const on=!voice.muted&&m>14;$$('[data-vc][data-u="me"]').forEach(x=>x.classList.toggle('sp',on));
    },120);
    toast('Mikrofon açık 🎤');
  }catch(e){
    toast(e&&e.name==='NotAllowedError'?'Mikrofon izni verilmedi. Tarayıcı adres çubuğundan izin ver.':'Mikrofon açılamadı (bu sayfada izin kapalı olabilir)');
  }
}
function stopMic(){if(mic.t)clearInterval(mic.t);if(mic.stream)mic.stream.getTracks().forEach(t=>t.stop());try{mic.ctx&&mic.ctx.close()}catch(e){}mic={stream:null,ctx:null,an:null,buf:null,t:null}}
function joinVoice(cid){
  if(voice.me&&voice.me!==cid)voice.users[voice.me]=(voice.users[voice.me]||[]).filter(u=>u!=='me');
  voice.users[cid]=voice.users[cid]||[];
  if(!voice.users[cid].includes('me'))voice.users[cid].push('me');
  voice.me=cid;sfx.join();toast('Ses kanalına katıldın');startMic();renderSide();renderUser();if(curChan().type==='voice')renderView();
}
function leaveVoice(){
  if(!voice.me)return;
  voice.users[voice.me]=(voice.users[voice.me]||[]).filter(u=>u!=='me');voice.me=null;stopMic();
  toast('Sesten ayrıldın');renderSide();renderUser();if(curChan().type==='voice')renderView();
}
function toggleMic(){voice.muted=!voice.muted;if(mic.stream)mic.stream.getAudioTracks().forEach(t=>t.enabled=!voice.muted);else if(!voice.muted&&voice.me)startMic();renderUser();renderSide();if(curChan().type==='voice')renderView()}

function addMessage(cid,m){
  const f=findChan(cid);if(!f)return;
  ensureMsgs(cid);S.msgs[cid].push(m);if(S.msgs[cid].length>120)S.msgs[cid].shift();
  const active=cid===S.active.c&&f.c.type==='text';
  if(active)appendMsg(m);
  else if(m.uid!=='me'){unread[cid]=(unread[cid]||0)+1;renderRail();renderSide()}
  if(m.uid!=='me'){
    sfx.recv();
    if(m.text.toLowerCase().includes('@'+S.user.name.toLowerCase()))toast(author(m).name+' seni etiketledi');
  }

const aiDefaults={provider:'auto',gkey:'',gmodel:'gemini-2.5-flash',okey:'',obase:'https://api.openai.com/v1',omodel:'gpt-4o-mini',pmodel:'',pollimodel:'openai'};

function providerOrder(){

const activeProvider=()=>{const c=aiCfg();if(c.provider==='off')return null;return providerOrder()[0]||null};

const withTimeout=(p,ms)=>{let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej({code:'timeout'}),ms)})]).finally(()=>clearTimeout(t))};
function txtOf(r){
  if(r==null)return'';
  if(typeof r==='string')return r;
  if(typeof r.text==='string'&&r.text)return r.text;
  if(r.message){const c=r.message.content;if(typeof c==='string')return c;if(Array.isArray(c))return c.map(p=>p&&(p.text||'')).join('')}
  if(Array.isArray(r))return r.map(p=>p&&(p.text||'')).join('');
  return String(r);
}
async function polliChat(messages){
  const c=aiCfg();
  const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:c.pollimodel||'openai',messages})});
  if(r.status===402||r.status===429)throw{code:'rate_limited'};
  if(r.status===401||r.status===403)throw{code:'not_granted'};
  if(!r.ok)throw{code:'http'};
  const d=await r.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
}
async function puterChat(messages){
  if(!hasPuter())throw{code:'no_puter'};

  const c=aiCfg(),opts={};if(c.pmodel)opts.model=c.pmodel;
  const r=await window.puter.ai.chat(messages,opts);

}
async function gemChat(messages){
  const c=aiCfg();if(!c.gkey)throw{code:'no_key'};
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
  const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const body={contents,generationConfig:{temperature:.95}};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(c.gmodel||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.gkey},body:JSON.stringify(body)});
  if(r.status===429)throw{code:'rate_limited'};
  if([400,401,403].includes(r.status))throw{code:'not_granted'};
  if(!r.ok)throw{code:'http'};
  const d=await r.json();
  return ((d.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
async function oaChat(messages){
  const c=aiCfg();if(!c.okey)throw{code:'no_key'};
  const base=(c.obase||'https://api.openai.com/v1').replace(/\/+$/,'');
  const r=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.okey},body:JSON.stringify({model:c.omodel||'gpt-4o-mini',messages,temperature:.95})});
  if(r.status===429)throw{code:'rate_limited'};
  if([400,401,403].includes(r.status))throw{code:'not_granted'};
  if(!r.ok)throw{code:'http'};
  const d=await r.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
}
async function sampleChat(messages){
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
  const user=messages.filter(m=>m.role!=='system').map(m=>(m.role==='assistant'?'Asistan: ':'')+m.content).join('\n');
  return txtOf(await sampleFn((sys?sys+'\n\n':'')+user));
}
async function aiComplete(messages){
  const o=providerOrder();
  if(!o.length)throw{code:'no_provider'};
  let last=null;
  for(const p of o){
    try{
      if(p==='sample')return await sampleChat(messages);
      if(p==='polli')return await withTimeout(polliChat(messages),30000);
      if(p==='puter')return await withTimeout(puterChat(messages),90000);
      if(p==='gemini')return await withTimeout(gemChat(messages),45000);
      if(p==='openai')return await withTimeout(oaChat(messages),45000);
    }catch(e){last=e}
  }
  throw last||{code:'fail'};
}
function parseReplies(out,bots){
  let t=String(out||'').replace(/```json/gi,'```').trim();
  let data=null;
  try{data=JSON.parse(t)}catch(e){const m=t.match(/\{[\s\S]*\}/);if(m){try{data=JSON.parse(m[0])}catch(e2){}}}
  let arr=[];
  if(data&&Array.isArray(data.replies))arr=data.replies;
  else if(Array.isArray(data))arr=data;
  else if(data&&data.bot&&data.text)arr=[data];
  return arr.filter(r=>r&&bots.includes(r.bot)&&typeof r.text==='string'&&r.text.trim()).slice(0,2);
}
function aiErr(e,user){
  const code=e&&e.code;
  if(code==='no_provider'){if(!aiWarned){aiWarned=true;toast('Yapay zeka kapalı: Ayarlar → Yapay zeka')}}
  else if(code==='not_granted'&&activeProvider()!=='puter'){aiDenied=true;toast('Yapay zeka anahtarı geçersiz, hazır cevaplarla devam ediyorum')}
  else if(code==='rate_limited'){if(!aiWarned){aiWarned=true;toast('Ücretsiz yapay zeka sınırına takıldık, birazdan tekrar denerim')}}
  else if(code==='no_puter'){if(!aiWarned){aiWarned=true;toast('Yapay zeka için ücretsiz Puter girişi gerekiyor')}}
  else if(code!=='empty'&&code!=='timeout'){if(!aiWarned){aiWarned=true;toast('Yapay zeka şu an cevap veremedi, hazır cevap kullanıyorum')}}
  if(user)aiReady().then(r=>{if(!r)aiSetup()});
}

function leaveServer(s){
  S.servers=S.servers.filter(x=>x.id!==s.id);
  s.chans.forEach(c=>{delete S.msgs[c.id];if(voice.me===c.id)voice.me=null;delete voice.users[c.id]});
  const n=S.servers[0];toast(s.name+' sunucusundan ayrıldın');setActive(n.id,S.last[n.id]);
}

function aiServerInit(s){
  s.ai=true;s.owner=s.bots[0];s.rules=RULES.slice();s.strikes=0;s.msgCount=0;
  const id=s.id+'-kural';s.chans.unshift({id,name:'kurallar',type:'text',cat:s.cats[0].id,pool:'hos',topic:'Sunucu kuralları'});
  S.msgs[id]=[{id:rid(),uid:s.owner,text:'**KURALLAR**\n'+s.rules.map((r,i)=>(i+1)+'. '+r).join('\n')+'\nUymayana uyarı, sonra mute, sonra ban!',ts:NOW(),rx:{}}];

const canBot=sv=>!sv.ai||['Moderatör','Yönetici'].includes((sv.roles||{}).me);
const recent=[];
function modGate(c){
  const sv=findChan(c.id).s;
  if(sv.ai&&sv.muteUntil>NOW()){
    sv.strikes=(sv.strikes||0)+1;
    if(sv.strikes>=5){S.bans=S.bans||[];S.bans.push(sv.name);toast('Susturulmuşken yazmaya devam ettin, banlandın ⛔');leaveServer(sv);return false}
    toast('Susturuldun 🔇 '+Math.ceil((sv.muteUntil-NOW())/1000)+' sn kaldı ('+sv.strikes+'/5, yazmaya devam edersen ban!)');return false}
  return true}
function modCheck(c,t,m){
  const sv=findChan(c.id).s;if(!sv.ai)return;
  sv.msgCount=(sv.msgCount||0)+1;recent.push({t:NOW(),x:t});while(recent.length>8)recent.shift();
  let why='';
  if(BADW.test(t))why='uygunsuz dil';
  else if(recent.filter(z=>NOW()-z.t<6000).length>=5)why='spam';
  else if(recent.slice(-3).length===3&&recent.slice(-3).every(z=>z.x===t))why='aynı mesajı tekrar';
  else if(t.length>9&&t===t.toLocaleUpperCase('tr')&&/[A-ZÇĞİÖŞÜ]/.test(t))why='büyük harfle bağırma';
  if(!why){
    if(sv.msgCount===15&&!(sv.roles&&sv.roles.me)){sv.roles=sv.roles||{};sv.roles.me='Moderatör';setTimeout(()=>{botSay(c,sv.owner,'@'+S.user.name+' epeydir aktifsin, seni moderatör yaptım! 🛡️ Artık bot ekleyebilirsin.');renderMembers();save()},1500)}
    return;
  }
  sv.strikes=(sv.strikes||0)+1;const mod=talkers(sv).includes(sv.owner)?sv.owner:talkers(sv)[0],say=x=>botSay(c,mod,x);
  S.msgs[c.id]=S.msgs[c.id].filter(x=>x.id!==m.id);renderMsgs(false);
  if(sv.strikes>=5){say('@'+S.user.name+' kuralları sürekli çiğnedin ('+why+'). Banlandın! ⛔');setTimeout(()=>{S.bans=S.bans||[];S.bans.push(sv.name);leaveServer(sv);toast('Sunucudan banlandın ⛔')},2400)}
  else if(sv.strikes>=3){sv.muteUntil=NOW()+60000;say('@'+S.user.name+' '+why+' yüzünden 60 sn susturuldun 🔇 ('+sv.strikes+'/5)')}
  else say('⚠️ @'+S.user.name+' '+why+' yasak, mesajın silindi. Uyarı '+sv.strikes+'/5');
  save();
}

const BADW=/küfür|aptal|salak|gerzek|mal\b|şerefsiz/i;
const JOKES=['Bilgisayar neden soğuk? Pencereleri açık kalmış.','Piksel neden okula gitmiş? Çözünürlüğünü artırmak için.','Yazılımcı neden gözlük takar? C# göremediği için.'];
function cbotHandle(c,text,m){
  const s=findChan(c.id).s;if(!s.cbots||!s.cbots.length)return;
  s.cbots.forEach(b=>{
    const say=t=>setTimeout(()=>addMessage(c.id,{id:rid(),uid:'cb:'+b.id,text:t,ts:NOW(),rx:{}}),500+Math.random()*500),l=text.toLowerCase().trim(),P=b.prefix;
    if(l===P+'yardım'||l===P+'yardim')say(CMDS[b.kind](P).join(' | '));
    if(b.kind==='saas'&&/^(sa|selam|selamun aleyk[uü]m|merhaba|mrb)\b/.test(l))say(/^sa\b|^selamun/.test(l)?'as, hoş geldin! 👋':'Selam! Hoş geldin 🙂');
    if(b.kind==='mod'){
      if(BADW.test(l)){S.msgs[c.id]=S.msgs[c.id].filter(x=>x.id!==m.id);renderMsgs(false);say('⚠️ @'+S.user.name+' uygunsuz dil kullanma, mesajın silindi.')}
      else if(l.startsWith(P+'uyar'))say('⚠️ '+text.slice(P.length+4).trim()+' uyarıldı!');
      else if(l.startsWith(P+'sustur'))say('🔇 '+text.slice(P.length+6).trim()+' susturuldu.');
      else if(l.startsWith(P+'ban'))say('⛔ '+text.slice(P.length+3).trim()+' banlandı.');
      else if(l.startsWith(P+'temizle')){S.msgs[c.id]=[];renderMsgs(false);say('🧹 Kanal temizlendi.')}
    }
    if(b.kind==='eglence'){
      if(l===P+'zar')say('🎲 Zar: '+(1+Math.floor(Math.random()*6)));
      else if(l===P+'yazıtura'||l===P+'yazitura')say('🪙 '+pick(['Yazı','Tura']));
      else if(l===P+'şaka'||l===P+'saka')say(pick(JOKES));
      else if(l.startsWith(P+'8ball'))say('🎱 '+pick(['Evet','Hayır','Belki','Kesinlikle','Pek sanmam']));
    }
  });
}

function loadImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej();fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej();im.src=fr.result};fr.readAsDataURL(file)})}
async function processImage(file,w,h){
  const im=await loadImage(file),px=S.settings.pixPhoto!==false;
  const cw=px?w:w*4,ch=px?h:h*4,c=document.createElement('canvas');c.width=cw;c.height=ch;
  const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  x.fillStyle='#000';x.fillRect(0,0,cw,ch);
  const r=Math.max(cw/im.width,ch/im.height),dw=im.width*r,dh=im.height*r;
  x.drawImage(im,(cw-dw)/2,(ch-dh)/2,dw,dh);
  if(px){const d=x.getImageData(0,0,cw,ch),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.round(p[i]/51)*51;p[i+1]=Math.round(p[i+1]/51)*51;p[i+2]=Math.round(p[i+2]/51)*51}x.putImageData(d,0,0)}
  return c.toDataURL(px?'image/png':'image/jpeg',.88);
}
async function handleFile(f,w,h,cb){
  if(!f)return;
  if(f.size>12e6){toast('Dosya çok büyük (en fazla 12 MB)');return}
  try{cb(await processImage(f,w,h))}catch(e){toast('Görsel okunamadı, JPG veya PNG dene')}
}
function pickImage(w,h,cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';i.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.append(i);
  i.addEventListener('change',()=>{const f=i.files&&i.files[0];i.remove();handleFile(f,w,h,cb)});
  i.click();setTimeout(()=>i.remove(),120000);
}

function serverSettings(s){
  const body=()=>`<div class="pane plain" style="animation:none"><label class="lbl" for="svn" style="margin-top:0">Sunucu adı</label><input class="in" id="svn" maxlength="22" value="${esc(s.name)}" autocomplete="off">
   <label class="lbl" for="svp">Sunucu amacı</label><input class="in" id="svp" maxlength="120" value="${esc(s.purpose||'')}" placeholder="Örn. Birlikte oyun oynamak" autocomplete="off">
   <span class="lbl">Sunucu fotoğrafı</span>
   <div class="prof" style="padding-top:4px"><span class="srv" style="--c:${s.color};pointer-events:none">${okImg(s.icon)?`<img class="sic" src="${s.icon}" alt="">`:esc(initials(s.name))}</span><div style="display:flex;flex-wrap:wrap"><button class="btn pri" data-sa="icon">Fotoğraf yükle</button>${s.icon?'<button class="btn" data-sa="rmicon">Kaldır</button>':''}</div></div>
   <span class="lbl">Renk (fotoğraf yoksa)</span>${swatches(s.color)}
   <span class="lbl">Banner</span>
   <div class="bprev"${okImg(s.banner)?` style="background-image:url('${s.banner}')"`:''}>${okImg(s.banner)?'':'<span>Banner yok</span>'}</div>
   <div style="display:flex;flex-wrap:wrap"><button class="btn pri" data-sa="banner">Banner yükle</button>${s.banner?'<button class="btn" data-sa="rmbanner">Kaldır</button>':''}</div></div>
   <div class="mfoot"><button class="btn pri" data-close>Bitti</button></div>`;
  const el=openModal('Sunucu ayarları',`<div id="sbody" style="display:flex;flex-direction:column;flex:1;min-height:0">${body()}</div>`,{style:'height:auto;max-height:100%;width:min(520px,100%)'});
  const re=()=>{$('#sbody',el).innerHTML=body()};
  const upd=()=>{renderRail();renderSide();renderTop();save()};
  el.addEventListener('click',e=>{
    const sw=e.target.closest('[data-sw]');if(sw){s.color=sw.dataset.sw;re();upd();return}
    const b=e.target.closest('[data-sa]');if(!b)return;const k=b.dataset.sa;
    if(k==='icon')pickImage(32,32,d=>{s.icon=d;re();upd();toast('Sunucu fotoğrafı güncellendi')});
    if(k==='banner')pickImage(80,32,d=>{s.banner=d;re();upd();toast('Banner güncellendi')});
    if(k==='rmicon'){delete s.icon;re();upd()}
    if(k==='rmbanner'){delete s.banner;re();upd()}
  });
  el.addEventListener('input',e=>{if(e.target.id==='svp')s.purpose=clean(e.target.value,120);if(e.target.id==='svn'){const v=clean(e.target.value,22).trim();if(v){s.name=v;upd()}}});
}

function openSettings(tab){
  if(tab)settingsTab=tab;
  const tabs=[['profil','Profil'],['gorunum','Görünüm'],['yz','Yapay zeka'],['ses','Ses'],['hak','Hakkında']];
  const el=openModal('Ayarlar',`<div class="mbody"><div class="mtabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${k===settingsTab}">${n}</button>`).join('')}</div><div class="pane" id="pane">${paneHTML(settingsTab)}</div></div><div class="mfoot"><button class="btn pri" data-close>Kapat</button></div>`);
  const pane=()=>$('#pane',el);
  const re=()=>{const p=pane();p.innerHTML=paneHTML(settingsTab);p.style.animation='none';void p.offsetWidth;p.style.animation=''};
  el.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');
    if(t){settingsTab=t.dataset.tab;$$('[data-tab]',el).forEach(x=>x.setAttribute('aria-selected',x===t));re();sfx.open();return}
    const th=e.target.closest('[data-theme]');
    if(th){S.settings.theme=th.dataset.theme;applySettings();re();save();return}
    const g=e.target.closest('[data-tg]');
    if(g){const k=g.dataset.tg;S.settings[k]=!S.settings[k];g.setAttribute('aria-checked',S.settings[k]);applySettings();save();if(k==='sound')beep(660,.08);if(k==='ai'){re();if(S.settings.ai&&activeProvider()==='puter'&&hasPuter()&&!aiDenied)puterSignIn(el)}return}
    const sw=e.target.closest('[data-sw]');
    if(sw){S.user.color=sw.dataset.sw;re();renderUser();renderMembers();save();return}
    const pv=e.target.closest('[data-prov]');
    if(pv){setAiCfg({provider:pv.dataset.prov});aiWarned=false;re();sfx.open();return}
    const a=e.target.closest('[data-act]');
    if(a&&a.dataset.act==='reroll'){S.user.seed=rid();re();refreshPeople();save();sfx.open()}
    if(a&&a.dataset.act==='rmphoto'){delete S.user.photo;re();refreshPeople();save()}
    if(a&&a.dataset.act==='logout'){doSave();try{localStorage.removeItem('piksel_remember')}catch(e){}location.reload()}
    if(a&&a.dataset.act==='saveai'){setAiCfg({gkey:$('#gk',el).value.trim(),gmodel:$('#gm',el).value.trim()||'gemini-2.5-flash',okey:$('#ok',el).value.trim(),obase:$('#ob',el).value.trim()||'https://api.openai.com/v1',omodel:$('#om',el).value.trim()||'gpt-4o-mini'});aiWarned=false;toast('Yapay zeka ayarları kaydedildi');re()}
    if(a&&a.dataset.act==='aitest'){aiTest(el)}
    if(a&&a.dataset.act==='putersignin'){puterSignIn(el)}
    if(a&&a.dataset.act==='testsfx'){sfx.send();setTimeout(sfx.recv,300);setTimeout(sfx.join,500)}
  });
  el.addEventListener('change',e=>{
    if(e.target.dataset.file==='photo'){const f=e.target.files&&e.target.files[0];handleFile(f,32,32,d=>{S.user.photo=d;re();refreshPeople();save();toast('Profil fotoğrafı güncellendi')})}
  });
  el.addEventListener('input',e=>{
    if(e.target.id==='pname'){const v=clean(e.target.value,20).trim();if(v){S.user.name=v;renderUser();renderMembers();save()}}
  });
}

/* ---------- olay yönlendirme ---------- */
document.addEventListener('click',e=>{
  const srv=e.target.closest('[data-srv]');
  if(srv){setActive(srv.dataset.srv,S.last[srv.dataset.srv]);return}
  const ch=e.target.closest('[data-ch]');
  if(ch){const f=findChan(ch.dataset.ch);if(!f)return;setActive(f.s.id,f.c.id);if(f.c.type==='voice')joinVoice(f.c.id);return}
  const mem=e.target.closest('[data-mem]');
  if(mem){
    const id=mem.dataset.mem,a=who(id),b=BOTS[id]||{st:'on',act:'Sunucu botu'};
    openPop(mem,box=>{
      box.classList.add('card');
      box.innerHTML=`<span class="stw" style="--ring:var(--p1)">${avatar(a.seed,a.color,80,a.photo)}${statusDot(id==='me'?S.user.status:b.st)}</span><b style="color:${a.color}">${esc(a.name)}</b><span>${esc(id==='me'?STATUS[S.user.status]:b.act)}</span>${id==='me'?'':`<span style="line-height:1.15">${esc(PERSONA[id]||'Sunucu botu')}</span>`}${id==='me'?`<button class="btn" data-pa="edit">Profili düzenle</button>`:`<button class="btn pri" data-pa="tag">${icon('at',14)} Etiketle</button>`}${id==='me'?'':'<button class="btn" data-pa="role">Rol ata</button>'}`;
      box.addEventListener('click',ev=>{
        const p=ev.target.closest('[data-pa]');if(!p)return;closePop();
        if(p.dataset.pa==='role'){const sv=curServer();sv.roles=sv.roles||{};menu(mem,['Üye','VIP','Moderatör','Yönetici'].map(r=>({label:r,on:sv.roles[id]===r,fn:()=>{sv.roles[id]=r;renderMembers();save();toast(a.name+' → '+r)}})).concat([{sep:1},{label:'Rolü kaldır',fn:()=>{delete sv.roles[id];renderMembers();save()}}]));return}
        if(p.dataset.pa==='edit')openSettings('profil');
        else{const ta=$('#inp');if(curChan().type==='text'){ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+'@'+a.name+' ';autosize();ta.focus();closeDrawers()}}
      });
    },{side:'left'});
    return;
  }
  const act=e.target.closest('[data-act]');
  if(act){
    const k=act.dataset.act,id=act.dataset.id;
    switch(k){
      case'nav':$('#nav').classList.add('open');$('#scrim').classList.add('on');break;
      case'members':
        if(isMobile()){const m=$('#members');m.classList.toggle('show');$('#scrim').classList.toggle('on',m.classList.contains('show'));$('#nav').classList.remove('open')}
        else{$('#members').classList.toggle('closed');S.membersOpen=!$('#members').classList.contains('closed');save()}
        updateMbtn();break;
      case'settings':openSettings();break;
      case'addsrv':addServerModal();break;
      case'discover':discoverModal();break;
      case'botlab':botLab();break;
      case'addch':addChannelModal(id);break;
      case'cat':S.collapsed[id]=!S.collapsed[id];act.closest('.cat').classList.toggle('col',!!S.collapsed[id]);save();break;
      case'send':send();$('#inp').focus();break;
      case'emoji':picker(act,em=>{const ta=$('#inp'),a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;ta.value=ta.value.slice(0,a)+em+ta.value.slice(b);ta.focus();ta.setSelectionRange(a+em.length,a+em.length);autosize()});break;
      case'mic':toggleMic();break;
      case'joinv':joinVoice(id);break;
      case'leavev':leaveVoice();break;
      case'noreply':replyTo=null;renderReply();break;
      case'rx':toggleReaction(S.active.c,id,act.dataset.e);break;
      case'mrx':picker(act,em=>toggleReaction(S.active.c,id,em),{right:true});break;
      case'reply':startReply(id);break;
      case'mmore':msgMenu(act,id);break;
      case'status':
        menu(act,Object.keys(STATUS).map(k2=>({label:STATUS[k2],dot:k2,on:S.user.status===k2,fn:()=>{S.user.status=k2;renderUser();renderMembers();save()}})).concat([{sep:1},{label:'Profili düzenle',icon:'gear',fn:()=>openSettings('profil')}]));
        break;
    }
    return;
  }
  const msg=e.target.closest('.msg');
  if(msg&&matchMedia('(hover:none)').matches&&!e.target.closest('.tools')){
    const was=msg.classList.contains('sel');$$('.msg.sel').forEach(x=>x.classList.remove('sel'));if(!was)msg.classList.add('sel');
  }
});

/* kaydırma hareketleri (mobil) */
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=NOW()},{passive:true});
document.addEventListener('touchend',e=>{
  if(!isMobile()||popEl||modalEl)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dy)>45||NOW()-tt>600)return;
  if(e.target.closest('.emg,textarea'))return;
  const nav=$('#nav'),mem=$('#members');
  if(dx>0){if(mem.classList.contains('show'))closeDrawers();else if(!nav.classList.contains('open')){nav.classList.add('open');$('#scrim').classList.add('on')}}
  else{if(nav.classList.contains('open'))closeDrawers();else if(!mem.classList.contains('show')){mem.classList.add('show');$('#scrim').classList.add('on');updateMbtn()}}
},{passive:true});

  const s=pick(S.servers),vs=s.chans.filter(c=>c.type==='voice');if(!vs.length)return;

function updateLive(){
  const l=$('#live');
  if(room&&room.connected()){l.hidden=false;l.innerHTML=`<i></i>Canlı · ${peers}`}else l.hidden=true;
}
function onPeerMsg(m){
  if(m.isMe)return;
  const d=m.data;if(!d||typeof d!=='object')return;
  const cid=clean(d.c,40),f=findChan(cid);if(!f||f.c.type!=='text')return;
  const text=clean(d.t,500).trim();if(!text)return;
  addMessage(cid,{id:rid(),uid:'p:'+m.peer,text,ts:NOW(),rx:{},au:{name:clean(d.n,20).trim()||'Misafir',color:okColor(d.col)?d.col:'#9a92c9',seed:clean(d.sd,12)||'x'}});
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const r=await window.claude.use('room');if(!r)return;
    room=r;
    room.on('chat',onPeerMsg,()=>{});
    room.onPeers(ch=>{peers=ch.peers.length;updateLive()},()=>{});
    room.onConnection(()=>updateLive(),()=>{});
    updateLive();
  }catch(e){room=null}
})();

(async()=>{try{if(!window.claude||!window.claude.use)return;const f=await window.claude.use('sample');if(f)sampleFn=f}catch(e){}})();

Object.keys(BOTS).forEach(shuffleStatus);
function raid(){
  if(document.hidden||modalEl)return;
  const sv=pick(S.servers),c=sv.chans.find(x=>x.type==='text'&&x.name!=='kurallar');if(!c)return;
  const rd=Object.keys(BOTS).filter(b=>!sv.bots.includes(b)).sort(()=>Math.random()-.5).slice(0,3);
  const L=['RAID!!! 💥','bu sunucu artık bizim 😈','herkes kaçsın hahaha','@everyone bedava nitro 💀','spam spam spam 🔥'];
  toast('⚠️ '+sv.name+' sunucusuna baskın var!');
  rd.forEach((b,i)=>{for(let k=0;k<2;k++)setTimeout(()=>addMessage(c.id,{id:rid(),uid:b,text:pick(L),ts:NOW(),rx:{}}),(i*2+k)*700)});
  setTimeout(()=>{
    const mb=(sv.cbots||[]).find(b=>b.kind==='mod');
    if(mb)addMessage(c.id,{id:rid(),uid:'cb:'+mb.id,text:'🛡️ Baskın engellendi, saldırganlar banlandı.',ts:NOW(),rx:{}});
    else if(sv.ai)botSay(c,sv.owner,'Baskın yedik! Hepsini banlıyorum 🔨');
    else botSay(c,talkers(sv)[0],'sunucu patladı 😭 bir mod botu ekleyin acil!');
  },6500);
}
(function lr(){setTimeout(()=>{raid();lr()},120000+Math.random()*120000)})();
setTimeout(raid,50000);

/* ---------- küçük yardımcılar ---------- */
const stripEmoji=t=>String(t==null?'':t)
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu,'')
  .replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim();
const todayKey=()=>new Date().toISOString().slice(0,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============================================================
   1) TTS — karakter sesleri
   ============================================================ */
const TTS={voices:[],speaking:false};
function ttsLoad(){try{TTS.voices=window.speechSynthesis?speechSynthesis.getVoices()||[]:[]}catch(e){TTS.voices=[]}}
if('speechSynthesis' in window){ttsLoad();try{speechSynthesis.onvoiceschanged=ttsLoad}catch(e){}}
function ttsVoice(id){
  const r=rng('voice:'+id);
  const tr=TTS.voices.filter(v=>/^tr/i.test(v.lang));
  const pool=tr.length?tr:(TTS.voices.length?TTS.voices:[]);
  const voice=pool.length?pool[Math.floor(r()*pool.length)]:null;
  return {voice,rate:(S.settings.voiceRate||1)*(0.9+r()*0.32),pitch:0.7+r()*0.65};
}
function speak(text,id){
  if(!S.settings.voiceOut||!('speechSynthesis' in window))return;
  const c=stripEmoji(text);if(!c)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(c.slice(0,260));
    const v=ttsVoice(id||'me');
    u.lang=(S.settings.lang==='en'?'en-US':'tr-TR');
    u.rate=clamp(v.rate,.5,2);u.pitch=clamp(v.pitch,0,2);
    if(v.voice)u.voice=v.voice;
    u.onstart=()=>{TTS.speaking=true;markSpeaking(id,true)};
    u.onend=()=>{TTS.speaking=false;markSpeaking(id,false);if(VC.on)setTimeout(vcListen,450)};
    u.onerror=()=>{TTS.speaking=false;markSpeaking(id,false)};
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}TTS.speaking=false;$$('.av.speaking').forEach(a=>a.classList.remove('speaking'))}
function markSpeaking(id,on){
  if(!id)return;
  $$('[data-mem="'+id+'"] .av, [data-vc] .av').forEach(a=>a.classList.toggle('speaking',on));
}

/* ============================================================
   2) STT — mikrofonla yazma
   ============================================================ */
const STT={rec:null,on:false,supported:!!(window.SpeechRecognition||window.webkitSpeechRecognition)};
function sttInit(){
  if(!STT.supported)return null;
  if(STT.rec)return STT.rec;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const r=new SR();
  r.lang=(S.settings.lang==='en'?'en-US':'tr-TR');
  r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=()=>{STT.on=true;micUI()};
  r.onend=()=>{STT.on=false;micUI();if(VC.on&&!TTS.speaking)setTimeout(vcListen,600)};
  r.onerror=ev=>{
    STT.on=false;micUI();
    const e=ev&&ev.error;
    if(e==='not-allowed'||e==='service-not-allowed')toast('Mikrofon izni gerekli (tarayıcı ayarları)');
    else if(e!=='no-speech'&&e!=='aborted')toast('Ses alınamadı, tekrar dene');
  };
  r.onresult=ev=>{
    let txt='',final=false;
    for(let i=ev.resultIndex;i<ev.results.length;i++){txt+=ev.results[i][0].transcript;if(ev.results[i].isFinal)final=true}
    const inp=$('#inp');if(!inp)return;
    inp.value=(inp.value?inp.value.replace(/\s+$/,'')+' ':'')+txt.trim();
    autosize();
    if(final&&VC.on){setTimeout(()=>{if($('#inp').value.trim())send()},250)}
  };
  STT.rec=r;return r;
}
function sttToggle(){
  if(!STT.supported){toast('Bu tarayıcı sesle yazmayı desteklemiyor (Chrome önerilir)');return}
  const r=sttInit();
  if(STT.on){try{r.stop()}catch(e){}}
  else{try{r.start()}catch(e){toast('Mikrofon başlatılamadı')}}
}
function micUI(){
  const b=$('#micbtn');if(b)b.classList.toggle('on',STT.on);
  const bar=$('#recbar');if(bar)bar.hidden=!(STT.on&&!VC.on);
}

/* ============================================================
   3) Sesli sohbet (eller serbest)
   ============================================================ */
const VC={on:false};
function vcToggle(){
  if(!STT.supported){toast('Sesli sohbet için mikrofon desteği yok (Chrome önerilir)');return}
  VC.on=!VC.on;
  const b=$('#vchatbtn');if(b)b.classList.toggle('on',VC.on);
  const bar=$('#vcbar');if(bar)bar.hidden=!VC.on;
  if(VC.on){
    if(!S.settings.voiceOut){S.settings.voiceOut=true;save()}
    S.stats.voice++;checkBadges();
    toast('🎙️ Sesli sohbet açık — konuş, karakterler sesli cevap verecek');
    vcListen();
  }else{
    toast('Sesli sohbet kapalı');
    stopSpeak();
    try{STT.rec&&STT.rec.stop()}catch(e){}
  }
}
function vcListen(){
  if(!VC.on||TTS.speaking)return;
  const r=sttInit();if(!r)return;
  try{r.start()}catch(e){}
}

function memOf(id){S.mem[id]=S.mem[id]||[];return S.mem[id]}
function remember(id,note){
  const n=clean(note,160).trim();if(!n)return;
  const a=memOf(id);if(a.some(x=>x.n===n))return;
  a.push({n,ts:NOW()});if(a.length>24)a.shift();save();
}
function autoRemember(bot,text){
  const m=String(text||'');
  let r=null;
  if(/benim ad[ıi]m\s+([\p{L}\p{N} _-]{2,20})/iu.test(m))r=m.match(/benim ad[ıi]m\s+([\p{L}\p{N} _-]{2,20})/iu)[0];
  else if(/\b(ben|bana)\b.{0,40}\b(severim|seviyorum|hoşlan[ıi]r[ıi]m|nefret ederim|istiyorum)\b/iu.test(m))r=m.slice(0,120);
  else if(/\bhat[ıi]rla\b/iu.test(m))r=m.replace(/^.*?hat[ıi]rla/iu,'').trim().slice(0,120);
  if(r)remember(bot,r);
}

async function dramaTurn(c,topic){
  const f=findChan(c.id);if(!f)return;const sv=f.s,bots=talkers(sv);
  if(bots.length<2){toast('Drama için en az 2 karakter gerek');return}
  const hist=(S.msgs[c.id]||[]).slice(-10).map(x=>author(x).name+': '+x.text.replace(/\s+/g,' ').slice(0,200)).join('\n');
  const cast=bots.slice(0,5).map(b=>`- id="${b}", ad="${BOTS[b].name}": ${PERSONA[b]||''}`).join('\n');
  const sys=`"${sv.name}" sunucusunda karakterler arası bir sahne canlandırıyorsun. Karakterler birbirine hitap ederek, gerçek insanlar gibi tartışıp/şakalaşıp/atışarak konuşur. ${langName()} yaz. Karakterler:\n${cast}`;
  const user=`Sahne konusu: ${topic||'günlük köy hayatından bir an'}\nSon mesajlar:\n${hist}\n\nGörev: Karakterlerden 2 tanesi sırayla birbirine cevap veren kısa replikler yazsın (toplam 2-4 replik). SADECE JSON: {"replies":[{"bot":"id","text":"..."}]}`;
  try{
    const out=await aiOne(sys,user);
    const arr=parseReplies(out,bots);
    if(!arr.length)throw{code:'empty'};
    arr.forEach((r,i)=>setTimeout(()=>botSay(c,r.bot,clean(r.text,300)),i*1600));
  }catch(e){aiErr(e,false);toast('Drama başlatılamadı')}
}

  toast(S.settings.drama?'🎭 Drama modu açık — karakterler kendi aralarında oynayacak':'Drama modu kapalı');
  updateDramaBar();

function runCommand(text,c){
  const raw=text.slice(1).trim();
  const sp=raw.split(/\s+/);
  const cmd=(sp[0]||'').toLocaleLowerCase('tr');
  const arg=raw.slice(sp[0].length).trim();
  const f=findChan(c.id),sv=f.s;
  switch(cmd){
    case'yardım':case'yardim':case'help':cmdHelp();return true;
    case'resim':case'görsel':case'gorsel':case'image':
      if(!arg){toast('Kullanım: /resim <istek>');return true}
      makeImage(c,arg);return true;
    case'özet':case'ozet':case'summary':aiSummarize(c);return true;
    case'çevir':case'cevir':case'translate':aiTranslate(c,arg);return true;
    case'şaka':case'saka':case'joke':aiJoke(c);return true;
    case'anket':case'poll':aiPoll(c,arg);return true;
    case'zar':case'dice':addMessage(c.id,{id:rid(),uid:pick(talkers(sv)),text:'🎲 Zar: '+(1+Math.floor(Math.random()*6)),ts:NOW(),rx:{}});return true;
    case'yazıtura':case'yazitura':case'coin':addMessage(c.id,{id:rid(),uid:pick(talkers(sv)),text:'🪙 '+pick(['Yazı','Tura']),ts:NOW(),rx:{}});return true;
    case'8ball':addMessage(c.id,{id:rid(),uid:pick(talkers(sv)),text:'🎱 '+pick(['Evet','Hayır','Belki','Kesinlikle','Pek sanmam','Şüpheliyim']),ts:NOW(),rx:{}});return true;
    case'hatırla':case'hatirla':
      if(!arg){toast('Kullanım: /hatırla <not>');return true}
      talkers(sv).forEach(b=>remember(b,arg));toast('🧠 Karakterler not etti');return true;
    case'drama':dramaTurn(c,arg);return true;
    case'sunucu':case'server':aiServerModal();return true;
    case'temizle':case'clear':
      if(!canBot(sv)&&!sv.ai){toast('Burada temizleme yetkin yok');return true}
      S.msgs[c.id]=[];renderMsgs(false);save();toast('🧹 Kanal temizlendi');return true;
    case'ses':S.settings.voiceOut=!S.settings.voiceOut;save();toast(S.settings.voiceOut?'🔊 Sesli cevap açık':'🔇 Sesli cevap kapalı');if(!S.settings.voiceOut)stopSpeak();return true;
    case'sessiz':stopSpeak();toast('🔇 Ses durduruldu');return true;
    case'dil':case'lang':
      S.settings.lang=(arg.toLowerCase().startsWith('en')?'en':'tr');save();

    case'müzik':case'muzik':case'music':musicModal();return true;
    case'oyun':case'games':gamesModal();return true;
    default:return false;
  }
}

const MUSIC={playing:false,ctx:null,timer:null,i:0,cur:null};
const TRACKS=[
  {name:'Köy Sabahı',notes:[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294]},
  {name:'8-Bit Yağmur',notes:[220,262,330,262,247,294,370,294,220,262,330,440,392,330,262,196]},
  {name:'Mağara Yankısı',notes:[196,196,233,196,175,196,233,262,196,196,175,165,175,196,220,233]},
  {name:'Zippi Marşı',notes:[523,523,587,659,659,587,523,440,392,392,440,523,523,440,440,392]}
];
function tone(f,dur=0.26,type='square',v=0.05){
  try{
    MUSIC.ctx=MUSIC.ctx||new(window.AudioContext||window.webkitAudioContext)();
    if(MUSIC.ctx.state==='suspended')MUSIC.ctx.resume();
    const o=MUSIC.ctx.createOscillator(),g=MUSIC.ctx.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(MUSIC.ctx.destination);
    const t=MUSIC.ctx.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function musicStop(){MUSIC.playing=false;if(MUSIC.timer)clearTimeout(MUSIC.timer);MUSIC.timer=null;updateMusicUI()}
function musicPlay(tr){
  musicStop();MUSIC.cur=tr;MUSIC.playing=true;MUSIC.i=0;
  const step=()=>{
    if(!MUSIC.playing)return;
    const f=tr.notes[MUSIC.i%tr.notes.length];
    tone(f,0.24,'square',0.045);
    if(MUSIC.i%4===0)tone(f/2,0.24,'triangle',0.03);
    MUSIC.i++;updateMusicUI();
    MUSIC.timer=setTimeout(step,300);
  };
  step();updateMusicUI();
}
function updateMusicUI(){
  const el=$('#musicnow');if(!el)return;
  if(!MUSIC.playing||!MUSIC.cur){el.innerHTML='<div class="np">'+icon('spk',16)+'<b>Müzik durduruldu</b></div>';return}
  const pct=Math.round(((MUSIC.i%MUSIC.cur.notes.length)/MUSIC.cur.notes.length)*100);
  el.innerHTML='<div class="np">'+icon('spk',16)+'<b>▶ '+esc(MUSIC.cur.name)+'</b><span class="chip">8-bit</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
}
function musicModal(){
  const el=openModal('Müzik botu','<div class="pane plain" style="animation:none"><div class="music" id="musicnow"></div><span class="lbl">Çalma listesi</span>'+TRACKS.map((tr,i)=>`<button class="track" data-tr="${i}">${icon('spk',14)}<span>${esc(tr.name)}</span></button>`).join('')+'<div style="padding-top:10px"><button class="btn dng" data-mstop>Durdur</button></div><p class="note">Müzik, tarayıcıda üretilen 8-bit chiptune olarak çalar (internet gerektirmez).</p></div>',{style:'height:auto;max-height:100%;width:min(520px,100%)'});
  updateMusicUI();
  el.addEventListener('click',e=>{
    const tr=e.target.closest('[data-tr]');if(tr){musicPlay(TRACKS[+tr.dataset.tr]);return}
    if(e.target.closest('[data-mstop]')){musicStop()}
  });
  const close=()=>{};
  el.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
}

/* ---------- seviye / XP ---------- */
const levelOf=xp=>Math.floor(Math.sqrt(Math.max(0,xp)/60))+1;
const xpForLevel=l=>Math.round(60*(l-1)*(l-1));
function awardXP(n){
  if(!n)return;S.xp=(S.xp||0)+n;const nl=levelOf(S.xp);
  if(nl>S.level){S.level=nl;levelUp(nl)}
  const d=todayKey();S.stats.days[d]=(S.stats.days[d]||0)+n;
  save();refreshXPUI();
}
function levelUp(l){
  toast('⭐ Seviye '+l+'! Tebrikler 🎉');sfx.join();
  const b=$('#lvlbadge');if(b){b.classList.remove('lvlpop');void b.offsetWidth;b.classList.add('lvlpop')}
  checkBadges();
}
function refreshXPUI(){
  const b=$('#lvlbadge');if(b)b.textContent='SV '+S.level;
  const bar=$('#xpfill');
  if(bar){const cur=S.xp-xpForLevel(S.level),need=Math.max(1,xpForLevel(S.level+1)-xpForLevel(S.level));bar.style.width=Math.max(0,Math.min(100,Math.round(cur/need*100)))+'%'}
}

   <div class="gut">${cont?`<span class="t2">${hm(m.ts)}</span>`:avatar(a.seed,a.color,44,a.photo)}</div>

openSettings=function(tab){
  if(tab)settingsTab=tab;
  const el=openModal('Ayarlar',`<div class="mbody"><div class="mtabs" role="tablist">${TABSLIST.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${k===settingsTab}">${n}</button>`).join('')}</div><div class="pane" id="pane">${paneHTML(settingsTab)}</div></div><div class="mfoot"><button class="btn pri" data-close>Kapat</button></div>`);
  const pane=()=>$('#pane',el);
  const re=()=>{const p=pane();p.innerHTML=paneHTML(settingsTab);p.style.animation='none';void p.offsetWidth;p.style.animation='';refreshXPUI()};
  el.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');
    if(tb){settingsTab=tb.dataset.tab;$$('[data-tab]',el).forEach(x=>x.setAttribute('aria-selected',x===tb));re();sfx.open();return}
    const th=e.target.closest('[data-theme]');
    if(th){S.settings.theme=th.dataset.theme;if(th.dataset.theme==='ozel'&&!S.settings.custom)S.settings.custom={};applySettings();re();save();return}
    const g=e.target.closest('[data-tg]');
    if(g){const k=g.dataset.tg;S.settings[k]=!S.settings[k];g.setAttribute('aria-checked',S.settings[k]);applySettings();save();
      if(k==='sound')beep(660,.08);
      if(k==='notif'&&S.settings.notif)askNotif();
      if(k==='drama')updateDramaBar();
      if(k==='ai'){re();if(S.settings.ai&&activeProvider()==='puter'&&hasPuter()&&!aiDenied)puterSignIn(el)}
      return}
    const lg=e.target.closest('[data-lang]');
    if(lg){S.settings.lang=lg.dataset.lang;save();re();renderTop();toast('🌐 '+(S.settings.lang==='en'?'English':'Türkçe'));return}
    const sw=e.target.closest('[data-sw]');
    if(sw){S.user.color=sw.dataset.sw;re();renderUser();renderMembers();save();return}
    const pv=e.target.closest('[data-prov]');
    if(pv){setAiCfg({provider:pv.dataset.prov});aiWarned=false;re();sfx.open();return}
    const cm=e.target.closest('[data-clearmem]');
    if(cm){delete S.mem[cm.dataset.clearmem];save();re();return}
    const a=e.target.closest('[data-act]');
    if(a){const k=a.dataset.act;
      if(k==='reroll'){S.user.seed=rid();re();refreshPeople();save();sfx.open()}
      else if(k==='rmphoto'){delete S.user.photo;re();refreshPeople();save()}
      else if(k==='logout'){doSave();try{localStorage.removeItem('piksel_remember')}catch(e){}location.reload()}
      else if(k==='saveai'){setAiCfg({gkey:$('#gk',el).value.trim(),gmodel:$('#gm',el).value.trim()||'gemini-2.5-flash',okey:$('#ok',el).value.trim(),obase:$('#ob',el).value.trim()||'https://api.openai.com/v1',omodel:$('#om',el).value.trim()||'gpt-4o-mini'});aiWarned=false;toast('Yapay zeka ayarları kaydedildi');re()}
      else if(k==='aitest')aiTest(el);
      else if(k==='putersignin')puterSignIn(el);
      else if(k==='testsfx'){sfx.send();setTimeout(sfx.recv,300);setTimeout(sfx.join,500)}
      else if(k==='testtts'){S.settings.voiceOut=true;speak('Merhaba, ben AI Zippi. Sesli cevap böyle çalışır.',pick(Object.keys(BOTS)))}
      return;
    }
  });
  el.addEventListener('change',e=>{
    if(e.target.dataset.file==='photo'){const f=e.target.files&&e.target.files[0];handleFile(f,32,32,d=>{S.user.photo=d;re();refreshPeople();save();toast('Profil fotoğrafı güncellendi')})}
    if(e.target.dataset.pal){S.settings.custom=Object.assign({},S.settings.custom);S.settings.custom[e.target.dataset.pal]=e.target.value;S.settings.theme='ozel';applySettings();save()}
    if(e.target.id==='impf'){const f=e.target.files&&e.target.files[0];if(f)importData(f)}
  });
  el.addEventListener('input',e=>{
    if(e.target.id==='pname'){const v=clean(e.target.value,20).trim();if(v){S.user.name=v;renderUser();renderMembers();save()}}
    if(e.target.id==='vrate'){S.settings.voiceRate=parseFloat(e.target.value);const l=$('#vratev',el);if(l)l.textContent=S.settings.voiceRate.toFixed(1);save()}
  });
};

/* ---------- slash komut otomatik tamamlama ---------- */
function hideSlash(){const b=$('#slashbox');if(b)b.remove()}
function slashUpdate(){
  const ta=$('#inp');if(!ta)return;
  const v=ta.value;
  if(!v.startsWith('/')||v.includes(' ')){hideSlash();return}
  const q=v.slice(1).toLocaleLowerCase('tr');
  const list=CMDSL.filter(([c])=>c.slice(1).toLocaleLowerCase('tr').startsWith(q));
  if(!list.length){hideSlash();return}
  let box=$('#slashbox');
  if(!box){box=document.createElement('div');box.className='slash';box.id='slashbox';const comp=$('.comp');if(comp)comp.append(box)}
  box.innerHTML=list.map(([c,d],i)=>`<button data-sc="${esc(c)}" class="${i===0?'sel':''}"><code>${esc(c)}</code><span>${esc(d)}</span></button>`).join('');
  box.onclick=ev=>{const b=ev.target.closest('[data-sc]');if(b){ta.value=b.dataset.sc+' ';ta.focus();autosize();hideSlash()}};
}
document.addEventListener('keydown',e=>{
  const box=$('#slashbox');
  if(!box||document.activeElement!==$('#inp'))return;
  if(e.key==='Enter'){const sel=box.querySelector('button.sel')||box.querySelector('button');if(sel){e.preventDefault();e.stopPropagation();const ta=$('#inp');ta.value=sel.dataset.sc+' ';ta.focus();autosize();hideSlash()}}
  else if(e.key==='Escape'){e.stopPropagation();hideSlash()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const bs=[...box.querySelectorAll('button')];let i=bs.findIndex(b=>b.classList.contains('sel'));
    i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach(b=>b.classList.remove('sel'));bs[i].classList.add('sel');
  }
},true);

/* ---------- karakter düzenlemeleri (kalıcı) ---------- */
S.bots=S.bots||{};
function botXP(uid){let h=2166136261;const s=String(uid);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (Math.abs(h)%5200)+140}
function applyBotOverrides(){
  for(const uid in S.bots){const o=S.bots[uid]||{};
    if(BOTS[uid]){if(o.name)BOTS[uid].name=o.name;if(o.color)BOTS[uid].color=o.color}
    if(o.persona)PERSONA[uid]=o.persona;
  }
}
/* author kancası: özel avatar tohumu / ad / renk */
const _author5=author;
author=function(m){
  const a=_author5(m);const o=m&&m.uid&&S.bots[m.uid];
  if(o){if(o.name)a.name=o.name;if(o.color)a.color=o.color;if(o.seed)a.seed=o.seed}
  return a;
};

/* ---------- profil kartı ---------- */
function profileCard(uid){
  const isMe=uid==='me',isBot=!!BOTS[uid];
  const a=who(uid);
  const xp=isMe?(S.xp||0):botXP(uid);
  const lvl=isMe?(S.level||1):levelOf(xp);
  const cur=xp-xpForLevel(lvl),need=Math.max(1,xpForLevel(lvl+1)-xpForLevel(lvl));
  const pct=Math.max(0,Math.min(100,Math.round(cur/need*100)));
  const role=isMe?(rl('me')||'Üye'):(rl(uid)||(isBot?'AI karakter':'Üye'));
  const st=isMe?S.user.status:(BOTS[uid]?BOTS[uid].st:'on');
  const act=isMe?'Sen':(BOTS[uid]?(BOTS[uid].act||'Çevrimiçi'):'');
  const persona=isBot?(PERSONA[uid]||''):'';
  const memN=isBot&&S.mem[uid]?S.mem[uid].length:0;
  let badgesHTML='';
  if(isMe){badgesHTML=`<span class="lbl">Rozetler (${Object.keys(S.badges).length}/${BADGES.length})</span><div class="badges">${BADGES.map(b=>`<span class="badge${S.badges[b[0]]?' on':''}" title="${esc(b[2])}">${icon(b[3],14)} ${esc(b[1])}</span>`).join('')}</div>`}
  let actions='';
  if(isBot){
    actions=`<button class="btn pri" data-pc="dm">${icon('chat',16)} DM gönder</button>`
      +`<button class="btn" data-pc="mention">${icon('at',16)} Etiketle</button>`
      +`<button class="btn" data-pc="listen">${icon('spk',16)} Sesi dinle</button>`
      +`<button class="btn" data-pc="edit">${icon('wand',16)} Düzenle</button>`;
  }else{
    actions=`<button class="btn pri" data-pc="settings">${icon('gear',16)} Profili düzenle</button>`;
  }
  const el=openModal(a.name,`<div class="pcard">
    <div class="pc-top">
      <span class="stw">${avatar(a.seed,a.color,80,a.photo)}${statusDot(st)}</span>
      <div class="pc-id"><b style="color:${okColor(a.color)?a.color:'#9a92c9'}">${esc(a.name)}</b>
        <div class="pc-chips"><span class="chip">${esc(role)}</span>${isBot?'<span class="chip pri">AI</span>':''}<span class="chip">${esc(STATUS[st]||'')}</span></div>
        ${act?`<small class="pc-act">${esc(act)}</small>`:''}
      </div>
    </div>
    <div class="xpwrap"><span class="lvlbadge">SV ${lvl}</span><div class="xpbar"><i style="width:${pct}%"></i></div><span class="sttnote">${xp} XP</span></div>
    ${persona?`<p class="pc-persona">“${esc(persona)}”</p>`:''}
    ${isBot&&memN?`<p class="note">🧠 Bu karakterin seninle ilgili ${memN} notu var.</p>`:''}
    ${badgesHTML}
    <div class="pc-actions">${actions}</div>
  </div>`,{style:'height:auto;max-height:100%;width:min(460px,100%)'});
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-pc]');if(!b)return;
    const k=b.dataset.pc;
    if(k==='dm'){closeModal();dmOpen(uid)}
    else if(k==='mention'){closeModal();const ta=$('#inp');ta.value=(ta.value?ta.value+' ':'')+'@'+a.name+' ';ta.focus();autosize();slashUpdate()}
    else if(k==='listen'){const sample=persona?('Merhaba, ben '+a.name+'. '+persona.split('.')[0]+'.'):('Merhaba, ben '+a.name+'.');speak(sample,uid)}
    else if(k==='edit'){botEditor(uid)}
    else if(k==='settings'){closeModal();openSettings('profil')}
  });
  return el;
}

/* ---------- karakter düzenleyici ---------- */
function botEditor(uid){
  if(!BOTS[uid]){toast('Bu karakter düzenlenemez');return}
  const o=S.bots[uid]||{};
  const seed=o.seed||uid,color=o.color||BOTS[uid].color;
  const el=openModal('Karakteri düzenle',`<div class="pane plain" style="animation:none">
    <div class="prof"><span id="beav">${avatar(seed,color,72)}</span><button class="btn" data-be="reroll">Yeni avatar</button></div>
    <label class="lbl" for="bn">Ad</label><input class="in" id="bn" maxlength="16" value="${esc(BOTS[uid].name)}" autocomplete="off">
    <span class="lbl">Renk</span>${swatches(color)}
    <label class="lbl" for="bp">Kişilik (persona)</label><textarea class="in" id="bp" maxlength="400" style="height:auto" rows="4">${esc(PERSONA[uid]||'')}</textarea>
    <p class="note">Ad, renk, avatar ve kişilik değişir. Yapay zeka cevapları bu kişiliğe göre şekillenir.</p>
  </div><div class="mfoot"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="bsave">Kaydet</button></div>`,{style:'height:auto;max-height:100%;width:min(480px,100%)'});
  let curSeed=seed,curColor=color;
  const redraw=()=>{const h=$('#beav',el);if(h)h.innerHTML=avatar(curSeed,curColor,72)};
  el.addEventListener('click',e=>{
    const r=e.target.closest('[data-be]');
    if(r&&r.dataset.be==='reroll'){curSeed=rid();redraw();sfx.open();return}
    const sw=e.target.closest('[data-sw]');
    if(sw){curColor=sw.dataset.sw;redraw();$$('[data-sw]',el).forEach(x=>x.setAttribute('aria-pressed',x===sw));return}
  });
  $('#bsave',el).onclick=()=>{
    const name=clean($('#bn',el).value,16).trim()||BOTS[uid].name;
    const persona=clean($('#bp',el).value,400).trim();
    S.bots[uid]={name,color:curColor,seed:curSeed,persona};
    BOTS[uid].name=name;BOTS[uid].color=curColor;if(persona)PERSONA[uid]=persona;
    save();closeModal();renderMembers();renderMsgs(false);renderUser();
    toast('✅ '+name+' güncellendi');
  };
  return el;
}

/* ---------- XP sıralaması ---------- */
function leaderboard(){
  const rows=[{id:'me',name:S.user.name,color:S.user.color,xp:S.xp||0,lvl:S.level||1,me:1}];
  const seen=new Set();
  S.servers.forEach(sv=>(sv.bots||[]).forEach(b=>{
    if(seen.has(b)||!BOTS[b])return;seen.add(b);
    const a=who(b),xp=botXP(b);rows.push({id:b,name:a.name,color:a.color,xp,lvl:levelOf(xp)});
  }));
  rows.sort((a,b)=>b.xp-a.xp);
  const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
  const el=openModal('XP Sıralaması',`<div class="lb">${rows.map((r,i)=>`<div class="lbrow${r.me?' me':''}">
    <span class="lbr">${medal(i)}</span>${avatar(r.id==='me'?S.user.seed:r.id,r.color,36)}
    <span class="lbn"><b style="color:${okColor(r.color)?r.color:'#9a92c9'}">${esc(r.name)}${r.me?' (sen)':''}</b><span>Seviye ${r.lvl}</span></span>
    <span class="lbx">${r.xp} XP</span></div>`).join('')}</div>
    <p class="note" style="padding:10px 4px">Sen mesaj attıkça XP kazanırsın; karakterlerin XP'si sabittir. İlk 3'e girmek için sohbete devam! 🏆</p>`,{style:'height:auto;max-height:100%;width:min(460px,100%)'});
  el.addEventListener('click',e=>{const r=e.target.closest('.lbrow');if(r)return;});
  return el;
}

/* ---------- oyun sekmesine Sıralama düğmesi ---------- */
const _paneHTML5=paneHTML;
paneHTML=function(tab){
  let h=_paneHTML5(tab);
  if(tab==='oyun')h=h.replace('<button class="btn pri" data-act="games">','<button class="btn pri" data-act="rank">'+icon('trophy',14)+' Sıralama</button><button class="btn pri" data-act="games">');

/* ---------- /sıralama komutu ---------- */
const _runCommand5=runCommand;
runCommand=function(text,c){
  const cmd=text.slice(1).trim().split(/\s+/)[0].toLocaleLowerCase('tr');
  if(cmd==='sıralama'||cmd==='siralama'||cmd==='top'||cmd==='leaderboard'){leaderboard();return true}
  return _runCommand5(text,c);
};

/* ---------- tıklama kancaları ---------- */
document.addEventListener('click',e=>{
  const mem=e.target.closest('[data-mem]');
  if(mem){profileCard(mem.dataset.mem);return}
  const av=e.target.closest('.msg .gut .av, .msg .gut img.av');

  const act=e.target.closest('[data-act="rank"]');
  if(act){leaderboard();return}
});

/* ---------- eski veri temizliği (yinelenen kanal adları) ---------- */
function cleanChannels(){
  let changed=false;
  S.servers.forEach(sv=>{
    const seen=new Set();
    const keep=[];
    (sv.chans||[]).forEach(c=>{
      const key=(c.type||'text')+':'+(c.name||'').toLocaleLowerCase('tr');
      if(seen.has(key)){changed=true;return}
      seen.add(key);keep.push(c);
    });
    if(keep.length!==(sv.chans||[]).length)sv.chans=keep;
  });
  if(changed)save();
}

<script>(()=>{
const $=q=>document.querySelector(q),AK='piksel_accounts';
const getA=()=>{try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch(e){return{}}};
const setA=a=>{try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){}};
const hash=async(p,salt)=>{const d=new TextEncoder().encode(salt+':'+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}let x=5381;for(const b of d)x=(x*33^b)>>>0;return 'w'+x};
let rem=null;try{rem=localStorage.getItem('piksel_remember')}catch(e){}
if(rem){const A0=getA();if(A0[rem]){window.__acct=rem;window.__acctName=A0[rem].name||rem.replace(/^@/,'');window.__startApp();return;}}
let mode=Object.keys(getA()).length?'in':'up';
const el=document.createElement('div');el.id='login';
el.style.cssText='position:fixed;inset:0;z-index:250;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto';
el.innerHTML=`<div class="modal" style="height:auto;width:min(420px,100%);animation:none"><div class="mhd"><span>AI ZİPPİ</span></div><div class="pane plain" style="animation:none"><div class="kinds"><button class="btn" data-m="in">Giriş</button><button class="btn" data-m="up">Kayıt ol</button></div><label class="lbl" for="lu">Kullanıcı adı (@ ile başla)</label><input class="in" id="lu" placeholder="@gezgin" autocomplete="username" maxlength="20"><label class="lbl" for="lp">Şifre</label><input class="in" id="lp" type="password" autocomplete="current-password"><label class="remember"><input type="checkbox" id="lr" checked> Beni hatırla</label><p class="note" id="lm"></p><button class="btn pri" id="lgo"></button><p class="note">Hesabın bu cihazda saklanır. Şifreni unutursan kurtarma yolu yoktur.</p></div></div>`;
document.body.append(el);
const draw=()=>{el.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));$('#lgo').textContent=mode==='up'?'Hesap oluştur':'Giriş yap';$('#lm').textContent=mode==='up'?'İlk kez mi? Bir kullanıcı adı ve şifre seç.':'Kaldığın yerden devam etmek için gir.'};
draw();
el.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){mode=b.dataset.m;draw()}});
const go=async()=>{
  const u=$('#lu').value.trim(),p=$('#lp').value,m=$('#lm');
  if(!/^@[\p{L}\p{N}_]{2,19}$/u.test(u)){m.textContent='Kullanıcı adı @ ile başlamalı (örn. @gezgin), 2-19 harf veya rakam.';return}
  if(p.length<4){m.textContent='Şifre en az 4 karakter olmalı.';return}
  const A=getA(),k=u.toLowerCase();
  if(mode==='up'){
    if(A[k]){m.textContent='Bu kullanıcı adı kayıtlı, giriş yap.';return}
    const salt=Math.random().toString(36).slice(2);A[k]={salt,hash:await hash(p,salt),name:u.slice(1)};setA(A);
  }else{
    const a=A[k];if(!a||a.hash!==await hash(p,a.salt)){m.textContent='Kullanıcı adı ya da şifre yanlış.';return}
  }
  window.__acct=k;window.__acctName=u.slice(1);try{if($('#lr')&&$('#lr').checked)localStorage.setItem('piksel_remember',k);else localStorage.removeItem('piksel_remember')}catch(e){}
  el.remove();window.__startApp();
};
$('#lgo').onclick=go;el.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
})();</script>
